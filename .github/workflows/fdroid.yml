name: Publish F-Droid repo

# 发一个 GitHub Release 就自动把它的 APK 收进自建 F-Droid 仓库;
# 也可以在 Actions 页面手动触发,补发某一个已存在的 Release。
on:
  release:
    types: [published]
  # 改仓库配置/元数据、或改本工作流时自动重发一次(幂等:产物没变会跳过提交)。
  # 机器人自己只往 docs/fdroid/ 提交,不在下面的 paths 里,所以不会死循环。
  push:
    paths:
      - 'fdroid/**'
      - '.github/workflows/fdroid.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 Release tag(留空 = 最新一个 Release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fdroid-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fdroidserver
        run: |
          set -euo pipefail
          # 不用 Ubuntu 自带的 fdroidserver 2.2.1:它的 androguard 3.x 解析不了
          # 新版 aapt2 产出的 resources.arsc,会报 "res1 must be zero!"。
          # 改为装最新的 fdroidserver(>=2.4,配 androguard 4.x)。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            python3-dev \
            build-essential \
            default-jdk-headless \
            apksigner \
            aapt \
            openssl \
            rsync
          # 装在 runner 用户可写的位置($RUNNER_TEMP);/opt 属 root,用不了
          python3 -m venv "$RUNNER_TEMP/fdvenv"
          "$RUNNER_TEMP/fdvenv/bin/pip" install --quiet --upgrade pip setuptools wheel
          "$RUNNER_TEMP/fdvenv/bin/pip" install --quiet fdroidserver
          echo "$RUNNER_TEMP/fdvenv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fdvenv/bin/fdroid" --version
          "$RUNNER_TEMP/fdvenv/bin/pip" show androguard | head -2

      - name: Resolve release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.tag }}"; fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将发布 Release: $TAG"

      - name: Fetch signed APKs from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo /tmp/apks
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/apks
          cp /tmp/apks/*.apk fdroid/repo/
          ls -l fdroid/repo/

      - name: Restore repo signing key
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 secret FDROID_KEYSTORE_BASE64"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > fdroid/keystore.jks

      - name: Build repo index
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${FDROID_KEYSTORE_PASS:-}" ]; then
            echo "::error::缺少 secret FDROID_KEYSTORE_PASS"; exit 1
          fi
          cd fdroid
          # 口令只在本次运行的临时 checkout 里追加,不会被提交
          printf '\nkeystorepass: "%s"\nkeypass: "%s"\n' \
            "$FDROID_KEYSTORE_PASS" "$FDROID_KEYSTORE_PASS" >> config.yml
          chmod 600 config.yml
          fdroid update
          rm -f keystore.jks

      - name: Publish into docs/
        run: |
          set -euo pipefail
          mkdir -p docs/fdroid
          rm -rf docs/fdroid/repo
          cp -r fdroid/repo docs/fdroid/repo
          touch docs/.nojekyll
          du -sh docs/fdroid/repo

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/fdroid docs/.nojekyll
          if git diff --cached --quiet; then
            echo "仓库内容没有变化,跳过提交"
          else
            git commit -m "F-Droid repo: ${{ steps.rel.outputs.tag }}"
            git push
          fi
